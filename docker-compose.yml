services:
  backend:
    build:
      context: ./backend-FitAdmin
      dockerfile: Dockerfile
    container_name: fitadmin_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend-FitAdmin/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-FitAdmin
      dockerfile: Dockerfile
    container_name: fitadmin_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend-FitAdmin/.env
    depends_on:
      - backend
    restart: unless-stopped
